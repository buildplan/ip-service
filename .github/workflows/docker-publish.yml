name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "dev-*", "dev" ]
    tags: [ 'v*.*.*' ]
    paths-ignore: [ '**.md', '.gitignore', 'renovate.json', 'LICENSE', 'docs/**', 'nodhi.Dockerfile', 'docker-compose.yml', 'docker-compose-prod.yml', 'test/**', '.github/workflows/auto-tag.yml', '.github/workflows/ghcr-cleanup.yml' ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_HUB_REPO: iamdockin/ip-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Login to GHCR and Docker Hub
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Extract Metadata (Tags, Labels & Index Annotations)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=ref,event=branch

      # 3. Promote existing :latest multi-arch index for tag builds on the same commit
      - name: Promote existing :latest image for matching tag commit
        id: promote
        if: github.ref_type == 'tag'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EXPECTED_SHA: ${{ github.sha }}
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
          DOCKER_HUB_REPO: ${{ env.DOCKER_HUB_REPO }}
        run: |
          ghcr_image=$(printf '%s' "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          check_index() {
            local ref="$1"
            local raw
            raw=$(docker buildx imagetools inspect --raw "$ref" 2>/dev/null) || return 1
            printf '%s' "$raw" | jq -e --arg sha "$EXPECTED_SHA" '
              (.annotations["org.opencontainers.image.revision"] == $sha) and
              ([.manifests[]?.platform.architecture] | index("amd64") != null and index("arm64") != null)
            ' >/dev/null
          }

          if check_index "${ghcr_image}:latest" && check_index "${DOCKER_HUB_REPO}:latest"; then
            promote_ok=true
            promoted_any=false
            while IFS= read -r tag; do
              [ -z "$tag" ] && continue
              case "$tag" in
                "${ghcr_image}:"*)
                  echo "Promoting ${ghcr_image}:latest -> $tag (exact multi-arch digest preserved)"
                  docker buildx imagetools create --tag "$tag" "${ghcr_image}:latest" || { promote_ok=false; break; }
                  promoted_any=true
                  ;;
                "${DOCKER_HUB_REPO}:"*)
                  echo "Promoting ${DOCKER_HUB_REPO}:latest -> $tag (exact multi-arch digest preserved)"
                  docker buildx imagetools create --tag "$tag" "${DOCKER_HUB_REPO}:latest" || { promote_ok=false; break; }
                  promoted_any=true
                  ;;
              esac
            done <<< "$TAGS"

            if [ "$promote_ok" = "true" ] && [ "$promoted_any" = "true" ]; then
              echo "promoted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "No matching multi-arch :latest image found for $EXPECTED_SHA; running full cached build."
          echo "promoted=false" >> "$GITHUB_OUTPUT"

      # 4. Prepare for Multi-Arch Build (skipped when promoted)
      - name: Set up QEMU
        if: steps.promote.outputs.promoted != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.promote.outputs.promoted != 'true'
        uses: docker/setup-buildx-action@v4

      # 5. Login to DHI Registry (only needed when building)
      - name: Log in to DHI Registry
        if: steps.promote.outputs.promoted != 'true'
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build & Push with GitHub Actions layer caching
      - name: Build and push Docker image
        if: steps.promote.outputs.promoted != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: |
            type=gha,scope=${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
            type=gha,scope=main
          cache-to: ${{ github.ref_type == 'branch' && format('type=gha,mode=max,scope={0}', github.ref_name) || '' }}
