name: Auto Tag and Release

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(assets):')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: '0'

      - name: Verify commit is still HEAD of main and untagged
        id: check
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head_sha=$(git rev-parse HEAD)
          if [ "$head_sha" != "$WORKFLOW_SHA" ]; then
            echo "main advanced from $WORKFLOW_SHA to $head_sha; skipping tag."
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$(git tag --points-at HEAD 'v*.*.*')" ]; then
            echo "Commit $head_sha already has a version tag; skipping."
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_tag=true" >> "$GITHUB_OUTPUT"

      - name: Bump version and push tag
        if: steps.check.outputs.should_tag == 'true'
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          DEFAULT_BUMP: patch
          TAG_PREFIX: v
          BRANCH_HISTORY: compare
